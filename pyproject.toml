[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whattotest"
version = "0.2.0"
description = "What to test first in every release: risk-based test prioritisation from your git history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["testing", "qa", "regression", "release", "risk", "git"]

[project.scripts]
whattotest = "whattotest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["whattotest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/jussaragranja/whattotest"
Issues = "https://github.com/jussaragranja/whattotest/issues"
